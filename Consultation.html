<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Consultation - Ayush Hub</title>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #0f3822;
            --primary-light: #1b5e30;
            --accent: #2e7d32;
            --accent-soft: #e8f5e9;
            --bg-body: #f8faf8;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            line-height: 1.6;
        }

        /* 1. NAVBAR */
        header {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 8%;
            max-width: 1200px;
            margin: 0 auto;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .site-logo {
            height: 44px;
            width: 44px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--accent);
        }

        .logo-text {
            font-size: 20px;
            font-weight: 700;
            color: var(--primary);
            letter-spacing: -0.5px;
        }

        .nav-links {
            display: flex;
            gap: 24px;
            align-items: center;
            list-style: none;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text-main);
            font-weight: 500;
            font-size: 15px;
            transition: all 0.3s ease;
        }

        .nav-links a:hover {
            color: var(--accent);
        }

        .btn-consultation {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: #ffffff !important;
            padding: 10px 22px;
            border-radius: 30px;
            font-weight: 600 !important;
            box-shadow: 0 4px 12px rgba(46, 125, 50, 0.25);
            transition: all 0.3s ease;
        }

        /* 2. SECTION BANNER */
        .section-banner {
            position: relative;
            height: 200px;
            width: 100%;
            overflow: hidden;
            margin-bottom: 40px;
        }

        .section-banner img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .section-banner-overlay {
            position: absolute;
            inset: 0;
            background: rgba(15, 56, 34, 0.75);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
            padding: 0 20px;
        }

        .section-banner-overlay h2 {
            font-size: 32px;
            font-weight: 700;
        }

        .section-banner-overlay p {
            font-size: 15px;
            opacity: 0.85;
            margin-top: 6px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 20px 60px;
        }

        /* 3. GOOGLE FORM CARD CONTAINER */
        .form-card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.03);
            border: 1px solid rgba(0,0,0,0.04);
            overflow: hidden;
        }

        .form-card iframe {
            width: 100%;
            height: 850px;
            border: none;
            border-radius: 12px;
        }

        /* FOOTER */
        footer {
            background-color: var(--primary);
            color: #ffffff;
            text-align: center;
            padding: 24px;
            font-size: 13.5px;
            opacity: 0.95;
        }
    </style>
</head>
<body>

    <!-- NAVBAR -->
    <header>
        <nav class="navbar">
            <a href="index.html" class="logo-container">
                <img src="logo.jpeg" alt="Ayush Hub Logo" class="site-logo">
                <span class="logo-text">AYUSH HUB</span>
            </a>
            <ul class="nav-links">
                <li><a href="index.html#services">Services</a></li>
                <li><a href="index.html#articles">Articles</a></li>
                <li><a href="index.html#about">About Us</a></li>
                <li><a href="contact.html">Contact Us</a></li>
                <li><a href="consultation.html" class="btn-consultation">Book Consultation</a></li>
            </ul>
        </nav>
    </header>

    <!-- TOP BANNER -->
    <div class="section-banner">
        <img src="https://images.unsplash.com/photo-1544367567-0f2fcb009e0b?auto=format&fit=crop&w=1200&q=80" alt="Consultation Banner">
        <div class="section-banner-overlay">
            <h2>Book Consultation</h2>
            <p>Fill in your details below to schedule your appointment</p>
        </div>
    </div>

    <!-- MAIN CONTAINER - EMBEDDED GOOGLE FORM -->
    <main class="container">
        <div class="form-card">
            <iframe src="https://docs.google.com/forms/d/e/1FAIpQLScJp8kI3a-kllD7hLg5K_mFvIn88P2c05Zf9vJm5E1E6g8Hbg/viewform?embedded=true">Loading…</iframe>
        </div>
    </main>

    <!-- FOOTER -->
    <footer>
        &copy; 2026 Ayush Hub - All Rights Reserved | Gift of Nature
    </footer>

</body>
</html>
